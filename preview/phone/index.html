<script>
/* Set the theme before first paint, so the page never flashes the wrong one. */
(function () {
  var t = 'system';
  try { t = (JSON.parse(localStorage.getItem('kenari.settings.v1')) || {}).theme || 'system'; } catch (e) { /* storage blocked: follow the system */ }
  var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#06181D' : '#DAE5E1');
})();
</script>
<script>
/* If a script does not arrive, or the app cannot start, say so and offer a reload, in place of a page that waits forever. */
(function () {
  function failed() {
    if (window.Kenari && Kenari.booted) return;
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML = '<div class="wrap wrap-narrow notfound"><h1 class="page-title">The lab did not finish loading</h1><p class="page-lead">A file did not arrive, which can happen on a patchy connection or a strict office network. Your progress is safe in this browser. Reload the page to try again.</p><a class="key canary" href="" onclick="location.reload();return false">Reload the page</a></div>';
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    /* The font stylesheet may fail, as on a bank network. The fallback fonts cover that. */
    if (!t || t === window || t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /assets\/css\//.test(t.href))) failed();
  }, true);
})();
</script>
